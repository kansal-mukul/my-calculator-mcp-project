<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title { font: 700 32px 'Segoe UI', sans-serif; fill: #e5e7eb; }
      .label { font: 600 20px 'Segoe UI', sans-serif; fill: #a5b4fc; }
      .text { font: 18px 'Consolas', 'Courier New', monospace; fill: #d1fae5; }
      .muted { font: 18px 'Consolas', 'Courier New', monospace; fill: #93c5fd; }
      .panel { fill: rgba(17,24,39,0.9); stroke: #374151; stroke-width: 2; }
      .accent { fill: #22c55e; }
    </style>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect x="50" y="40" width="1100" height="520" rx="18" class="panel"/>
  <text x="90" y="92" class="title">MCP Server Startup</text>
  <text x="90" y="130" class="label">Server output</text>

  <rect x="90" y="155" width="1020" height="350" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <text x="120" y="205" class="text">[MCP SERVER] Starting on http://127.0.0.1:8001/mcp</text>
  <text x="120" y="245" class="text">[MCP TOOL] Registered: add(a, b)</text>
  <text x="120" y="285" class="text">[MCP TOOL] Registered: subtract(a, b)</text>
  <text x="120" y="325" class="text">[MCP TOOL] Registered: multiply(a, b)</text>
  <text x="120" y="365" class="text">[MCP TOOL] Registered: divide(a, b)</text>
  <text x="120" y="405" class="text">[MCP TOOL] Registered: validate_call(token, message)</text>
  <text x="120" y="445" class="text">[SERVER] Listening on 127.0.0.1:8001</text>
  <text x="120" y="485" class="muted">Status: READY</text>

  <circle cx="1060" cy="112" r="10" class="accent"/>
  <text x="1080" y="120" class="label">Healthy</text>
</svg>
